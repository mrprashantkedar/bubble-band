<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tap the bubbles to play your own tune."><title>Bubble Band</title><link rel="stylesheet" href="style.css"></head>
<body class="music" style="--sky:#f1d9ff;--ink:#713aa4"><main>
<header><h1>Bubble Band</h1><button id="sound" class="tool" aria-pressed="false">🔇 Sound</button></header>
<p class="intro">Tap the bubbles to play your own tune.</p>
<section class="world" aria-label="Game scene"><div class="scenery" aria-hidden="true"></div><div id="mascot" aria-hidden="true">🐸</div><div id="collection" aria-label="Discoveries"></div></section>
<section class="play" aria-label="Game controls"><div class="prompt"><span id="target" aria-hidden="true"></span><strong id="instruction" aria-live="polite"></strong></div><div id="board"></div><div class="actions"><button id="again" class="tool">Play again</button><p id="status" role="status"></p></div></section>
<footer><a href="https://github.com/mrprashantkedar/bubble-band/blob/main/RESEARCH.md">Research and design notes</a></footer></main><script src="game.js" defer></script></body></html>
